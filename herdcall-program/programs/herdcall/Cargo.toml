[package]
name = "herdcall"
version = "0.1.0"
description = "HerdCall - anti-sniper launchpad (Lobby -> Stampede -> Curve -> Breakout)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "herdcall"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "solana"))'] }
