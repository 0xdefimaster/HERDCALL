[package]
name = "herdcall"
version = "0.1.0"
edition = "2021"
description = "HerdCall launchpad program: Lobby, Stampede, bonding curve, breakout"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "herdcall"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.1", features = ["metadata"] }
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }
herdcall-core = { path = "../herdcall-core" }
